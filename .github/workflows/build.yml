name: Build

on:
  push:
    branches:
      - main
      - 'ci/**'
    paths-ignore:
      - '**.md'
      - 'patches/**'
      - '最新正式版.zip'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置 (Release / Snapshot / Debug)'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Snapshot
          - Debug

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Snapshot]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Describe
        shell: pwsh
        run: |
          $desc = (git describe --tags --always --dirty 2>$null)
          if ([string]::IsNullOrWhiteSpace($desc)) { $desc = $env:GITHUB_SHA.Substring(0, 7) }
          "PCL_DESCRIBE=$desc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore "PCLCS\PCLCS.csproj"

      - name: Build
        shell: pwsh
        run: |
          msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=AnyCPU `
            /m /v:minimal /nologo

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "Plain Craft Launcher 2\bin"
          if (Test-Path $bin) { Copy-Item "$bin\*" dist -Recurse -Force }
          Get-ChildItem dist -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Test-Path "dist\Plain Craft Launcher 2.exe")) {
            throw "Build finished but 'Plain Craft Launcher 2.exe' was not produced."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL-${{ matrix.configuration }}-${{ env.PCL_DESCRIBE }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14
