name: Build

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'patches/**'
      - '最新正式版.zip'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置 (Release / Snapshot / Debug)'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Snapshot
          - Debug

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.configuration)) || fromJSON('["Release","Snapshot"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Describe
        shell: pwsh
        run: |
          $desc = (git describe --tags --always --dirty 2>$null)
          if ([string]::IsNullOrWhiteSpace($desc)) { $desc = $env:GITHUB_SHA.Substring(0, 7) }
          "PCL_DESCRIBE=$desc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: |
            PCLCS/PCLCS.csproj
            MeloongCore/**/*.csproj

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Inject build secrets
        shell: pwsh
        env:
          MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.PCL_CURSEFORGE_API_KEY }}
        run: |
          $path = "Plain Craft Launcher 2\Modules\ModSecret.vb"
          $content = Get-Content -LiteralPath $path -Raw
          $changed = $false
          if ($env:MS_CLIENT_ID) {
            $old = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")'
            if (-not $content.Contains($old)) { throw "未找到 OAuthClientId 注入点，请检查 ModSecret.vb" }
            $new = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "' + $env:MS_CLIENT_ID + '")'
            $content = $content.Replace($old, $new)
            $changed = $true
            Write-Host "已注入微软登录 Client ID"
          } else {
            Write-Host "未配置 PCL_MS_CLIENT_ID，跳过正版登录注入（仍可用同名环境变量在运行时提供）"
          }
          if ($env:CF_API_KEY) {
            $old = 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")'
            if (-not $content.Contains($old)) { throw "未找到 CurseForgeAPIKey 注入点，请检查 ModSecret.vb" }
            $new = 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "' + $env:CF_API_KEY + '")'
            $content = $content.Replace($old, $new)
            $changed = $true
            Write-Host "已注入 CurseForge API Key"
          } else {
            Write-Host "未配置 PCL_CURSEFORGE_API_KEY，跳过 CurseForge 注入（仍可用同名环境变量在运行时提供）"
          }
          if ($changed) { Set-Content -LiteralPath $path -Value $content -NoNewline -Encoding utf8BOM }

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore "PCLCS\PCLCS.csproj"

      - name: Build
        shell: pwsh
        run: |
          msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=AnyCPU `
            /m /v:minimal /nologo

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "Plain Craft Launcher 2\bin"
          if (Test-Path $bin) { Copy-Item "$bin\*" dist -Recurse -Force }
          Get-ChildItem dist -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Test-Path "dist\Plain Craft Launcher 2.exe")) {
            throw "Build finished but 'Plain Craft Launcher 2.exe' was not produced."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL-${{ matrix.configuration }}-${{ env.PCL_DESCRIBE }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: PCL-Release-*
          merge-multiple: true
          path: dist

      - name: Package
        run: |
          ls -al dist
          cd dist && zip -r "../PCL-${GITHUB_REF_NAME}.zip" . && cd ..

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "PCL-${GITHUB_REF_NAME}.zip" \
            "dist/Plain Craft Launcher 2.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PCL ${GITHUB_REF_NAME}" \
            --generate-notes

